services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: songmatchup
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: songmatchup_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:15
    environment:
      POSTGRES_USER: songmatchup
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: songmatchup_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data: